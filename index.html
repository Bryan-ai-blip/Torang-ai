<!DOCTYPE html><html><head><title>Torang AI</title><meta name="viewport" content="width=device-width, initial-scale=1"><style>body{font-family:sans-serif;background:#111;color:#fff;display:flex;justify-content:center;margin:0}#chat{width:95%;max-width:500px;margin-top:20px}#messages{height:60vh;overflow-y:auto;border:1px solid #333;padding:12px;border-radius:10px;background:#1a1a1a}.row{display:flex;gap:8px}input{flex:1;padding:12px;border-radius:10px;border:none}button{padding:12px;border-radius:10px;border:none;background:#25D366;font-weight:bold}</style></head><body><div id="chat"><h2>Torang AI 🔥</h2><p style="color:#aaa;font-size:13px">Temen nongkrong AI dari Manado</p><div id="messages"><p><b>Torang:</b> Wey bro, selamat datang! Tanya apa aja, gas!</p></div><div class="row"><input id="input" placeholder="tanya apa aja bro..."><button onclick="send()">Kirim</button></div></div><script>async function send(){const i=document.getElementById('input'),m=i.value.trim();if(!m)return;const b=document.getElementById('messages');b.innerHTML+=`<p><b>Lu:</b> ${m}</p>`;i.value='';b.innerHTML+=`<p id="l"><b>Torang:</b> lagi mikir...</p>`;try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:m})});const d=await r.json();document.getElementById('l').remove();b.innerHTML+=`<p><b>Torang:</b> ${d.reply}</p>`}catch(e){document.getElementById('l').remove();b.innerHTML+=`<p><b>Torang:</b> Waduh error, API Key belum ke-setting.</p>`}b.scrollTop=b.scrollHeight}</script></body></html>
